name: Python Static Security & Type Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security-and-type-audit:
    name: Security & SAST Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Static Analysis & Audit Tooling
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit mypy flake8

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r . -ll -x ./venv,./.venv,./target,./tests

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          if [ -f requirements.txt ]; then
            pip-audit -r requirements.txt --strict
          else
            echo "requirements.txt not found, scanning installed packages"
            pip-audit --strict
          fi

      - name: Run Mypy Type Integrity Check
        run: |
          mypy --ignore-missing-imports --no-strict-optional acoustic providers telemetry
