name: Python Static Security & Type Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  security-and-type-audit:
    name: Security, Tests & SAST Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies & Audit Tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-worker.txt
          pip install bandit pip-audit mypy flake8

      - name: Run Bandit AST Security Scan
        run: |
          bandit -r . -ll -x ./venv,./.venv,./target,./tests

      - name: Run Pip-Audit Dependency Vulnerability Scan
        run: |
          pip-audit -r requirements-worker.txt --strict || pip-audit -r requirements-worker.txt

      - name: Run Unit & Integration Tests (Hermetic)
        env:
          GEMINI_API_KEY: "mock-gemini-key-for-ci"
          GROQ_API_KEY: "mock-groq-key-for-ci"
          AZURE_OPENAI_KEY: "mock-azure-key-for-ci"
          AZURE_SPEECH_KEY: "mock-azure-speech-key"
          BROKER_TYPE: "LOCAL"
          PROMETHEUS_MULTIPROC_DIR: "/tmp"
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Mypy Type Integrity Check
        run: |
          mypy --ignore-missing-imports --no-strict-optional acoustic providers telemetry || echo "Mypy type check completed with warnings (non-blocking)"

      - name: Run Flake8 Code Quality Audit
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,target,tests
          # Exit-zero for cosmetic / formatting lints
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics --exclude=venv,.venv,target,tests
