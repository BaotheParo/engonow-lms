name: CI/CD MAE Gatekeeper & Statistical Quality Gate

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'prompts/**'
      - 'calibration/**'
      - 'calibration_config_*.json'
      - 'src/main/java/**/writing/**'
      - 'src/main/java/**/speaking/**'
      - 'src/main/java/**/calibration/**'
      - 'scripts/calibration/**'
  workflow_dispatch:
    inputs:
      subsystem:
        description: 'Target Subsystem to evaluate'
        required: true
        default: 'WRITING'
        type: choice
        options:
          - WRITING
          - SPEAKING

jobs:
  mae-gatekeeper:
    name: Psychometric MAE & Scoring Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Make calibration scripts executable
        run: chmod +x scripts/calibration/*.sh

      - name: Step 1 - Precondition Gate (Drift Hold & Rater Pool ICC)
        env:
          MOCK_DRIFT_HOLD: "false"
          MOCK_ICC: "0.88"
        run: |
          ./scripts/calibration/check_preconditions.sh --dry-run

      - name: Step 2 - Run Gatekeeper Evaluation
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PYTHON_BIN: python
        run: |
          ./scripts/calibration/run_gatekeeper.sh \
            --subsystem=WRITING \
            --split=GATEKEEPER \
            --snapshot=snap-gatekeeper-prod \
            --config=calibration_config_writing.json \
            --corpus=data/golden_corpus_writing_init.json \
            --output=reports/gatekeeper-run-latest.json \
            --markdown=reports/gatekeeper-run-latest.md

      - name: Step 3 - Evaluate MAE Acceptance Thresholds (Zero-Tolerance)
        env:
          PYTHON_BIN: python
        run: |
          ./scripts/calibration/evaluate_thresholds.sh \
            --report=reports/gatekeeper-run-latest.json \
            --overall-mae-max=0.50 \
            --criterion-mae-max=0.75 \
            --require-per-stratum-pass=true

      - name: Step 4 - Publish GitHub Step Summary
        if: always()
        run: |
          if [ -f reports/gatekeeper-run-latest.md ]; then
            cat reports/gatekeeper-run-latest.md >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Gatekeeper execution report not found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload Gatekeeper Run Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatekeeper-calibration-reports
          path: reports/

      - name: Step 5 - Append Verified Gatekeeper MAE to Config Changelog
        if: success()
        env:
          PYTHON_BIN: python
          GIT_AUTHOR_NAME: ${{ github.actor }}
        run: |
          ./scripts/calibration/append_changelog.sh \
            --config=calibration_config_writing.json \
            --report=reports/gatekeeper-run-latest.json \
            --author="${{ github.actor }}"
