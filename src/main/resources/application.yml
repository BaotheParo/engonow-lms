spring:
  application:
    name: engonow-lms-backend

  # Centralized distributed state (Lettuce connection pool)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

  # ─── DataSource (HikariCP) ────────────────────────────────────────────────
  datasource:
    url: >
      jdbc:mysql://localhost:3306/engonow_lms
      ?useSSL=false
      &serverTimezone=UTC
      &allowPublicKeyRetrieval=true
      &characterEncoding=UTF-8
      &rewriteBatchedStatements=true
    username: root
    password: ${DB_PASSWORD:engonow_root_2024}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: EngonowHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000       # 5 min
      connection-timeout: 20000  # 20 sec
      max-lifetime: 1800000      # 30 min
      leak-detection-threshold: 60000

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false   # Prevent lazy-loading anti-pattern via HTTP threads
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ─── Multipart File Upload ────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
      file-size-threshold: 2KB

# ─── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 20

# ─── Application-Specific Configuration ─────────────────────────────────────
app:
  ai-service:
    # Base URL of the Python FastAPI mock (or real AI microservice in production)
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-sec: 30

  cloudinary:
    cloud-name: engonow-demo
    api-key: ${CLOUDINARY_API_KEY:fake-api-key-dev}
    api-secret: ${CLOUDINARY_API_SECRET:fake-api-secret-dev}
    upload-folder: omr-scans

# ─── Springdoc / Swagger UI ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.engonow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    reactor.netty.http.client: INFO
