spring:
  application:
    name: engonow-lms-backend

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: UTC

  kafka:
    listener:
      ack-mode: manual_immediate
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

  # Centralized distributed state (Lettuce connection pool)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: ${REDIS_TIMEOUT:2000ms}
      lettuce:
        pool:
          max-active: ${REDIS_POOL_MAX_ACTIVE:16}
          max-idle: ${REDIS_POOL_MAX_IDLE:8}
          min-idle: ${REDIS_POOL_MIN_IDLE:2}
          max-wait: ${REDIS_POOL_MAX_WAIT:1000ms}

  # ─── DataSource (HikariCP) ────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/engonow_lms}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EngonowHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000       # 5 min
      connection-timeout: 20000  # 20 sec
      max-lifetime: 1800000      # 30 min
      leak-detection-threshold: 60000

  # ─── Flyway Migration ──────────────────────────────────────────────────────
  flyway:
    enabled: true
    baseline-on-migrate: true

  # ─── JPA / Hibernate ─────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false   # Prevent lazy-loading anti-pattern via HTTP threads
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_batch_fetch_size: 20
        jdbc:
          batch_size: 25
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  # ─── Multipart File Upload ────────────────────────────────────────────────
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
      file-size-threshold: 2KB

# ─── Server ─────────────────────────────────────────────────────────────────
server:
  port: 8080
  servlet:
    context-path: /
  tomcat:
    threads:
      max: 200
      min-spare: 20

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  metrics:
    tags:
      application: engonow-lms-backend

# ─── Application-Specific Configuration ─────────────────────────────────────
app:
  ai-service:
    # Base URL of the Python FastAPI mock (or real AI microservice in production)
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    connect-timeout-ms: 5000
    read-timeout-sec: 30

  cloudinary:
    cloud-name: engonow-demo
    api-key: ${CLOUDINARY_API_KEY:fake-api-key-dev}
    api-secret: ${CLOUDINARY_API_SECRET:fake-api-secret-dev}
    upload-folder: omr-scans

engonow:
  broker:
    type: ${ENGONOW_BROKER_TYPE:LOCAL}
    kafka:
      topic: ${ENGONOW_KAFKA_TOPIC:ielts-speaking-requests}
    topics:
      speaking-results: ${ENGONOW_KAFKA_RESULTS_TOPIC:ielts-speaking-results}
  outbox:
    relay-delay-ms: ${ENGONOW_OUTBOX_RELAY_DELAY_MS:500}

# ─── Springdoc / Swagger UI ──────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# ─── Logging ─────────────────────────────────────────────────────────────────
logging:
  level:
    com.engonow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.web: INFO
    reactor.netty.http.client: INFO
