version: "3.8"

networks:
  engonow-net:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  kafka_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Alpine Database
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: engonow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-engonow_db}
      POSTGRES_USER: ${POSTGRES_USER:-engonow_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-engonow_secure_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-engonow_app} -d ${POSTGRES_DB:-engonow_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Alpine (AOF + Password Protected)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: engonow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-engonow_redis_secret}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-engonow_redis_secret}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 3. Apache Kafka 3.8.0 KRaft Mode (Zero ZooKeeper)
  # ----------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.8.0
    container_name: engonow-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "4L62EnnTTAizmYnjOIa36A"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 4. Confluent Schema Registry 7.7.0
  # ----------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.7.0
    container_name: engonow-schema-registry
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 5. Java LMS Core Backend (Spring Boot 3.2 + Temurin 21)
  # ----------------------------------------------------------------------------
  lms-core:
    build:
      context: .
      dockerfile: Dockerfile.lms-core
    container_name: engonow-lms-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-engonow_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-engonow_app}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-engonow_secure_password}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-engonow_redis_secret}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus,metrics"
      MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED: "true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 6. Python AI Worker (Acoustic DSP + Provider Resilience + Multi-Process Metrics)
  # ----------------------------------------------------------------------------
  ai-worker:
    build:
      context: .
      dockerfile: Dockerfile.ai-worker
    container_name: engonow-ai-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_URL: redis://:${REDIS_PASSWORD:-engonow_redis_secret}@redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-engonow_app}:${POSTGRES_PASSWORD:-engonow_secure_password}@postgres:5432/${POSTGRES_DB:-engonow_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-mock_key}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-mock_key}
      GROQ_API_KEY: ${GROQ_API_KEY:-mock_key}
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
      GUNICORN_WORKERS: 4
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 7. Prometheus 2.54 Observability Server
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: engonow-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - engonow-net

  # ----------------------------------------------------------------------------
  # 8. Grafana 11.2 Dashboards & Visualization
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: engonow-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-engonow_admin_secure}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - engonow-net
